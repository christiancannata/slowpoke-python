name: release

# For every version tag: an archive of the package with a signed build provenance (Sigstore),
# attached to the GitHub release. Anyone can check where it comes from:
#   gh attestation verify slowpoke-python-v0.1.0.zip --repo christiancannata/slowpoke-python
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=zip --prefix="slowpoke-python/" -o "slowpoke-python-${TAG}.zip" "${TAG}"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: slowpoke-python-${{ github.ref_name }}.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE}" "slowpoke-python-${TAG}.zip.intoto.jsonl"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG#v}" --notes "See CHANGELOG.md"
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "slowpoke-python-${TAG}.zip" "slowpoke-python-${TAG}.zip.intoto.jsonl"
